name: Verify FORME
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chrome
      - name: Production browser tests
        run: |
          npm run preview > /tmp/forme-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:5180/ > /dev/null && break; sleep 1; done
          npm run test:e2e
          node scripts/verify-artifacts.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forme-evidence
          path: |
            docs/qa/
            test-results/
